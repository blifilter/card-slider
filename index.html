<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  overflow: hidden;
  user-select: none;
}

.slider-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 20px;
}

.cards-wrapper {
  width: 240px;
  height: 380px;
  position: relative;
  cursor: grab;
}

.cards-wrapper:active { cursor: grabbing; }

.card {
  position: absolute;
  width: 240px;
  height: 380px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(0,0,0,0.6);
  transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              opacity 0.5s ease;
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
}

/* מצבי הקלפים */
.card.state-active {
  transform: translateX(0) scale(1);
  opacity: 1;
  z-index: 3;
}

.card.state-prev {
  transform: translateX(60px) scale(0.9);
  opacity: 0.5;
  z-index: 2;
}

.card.state-next {
  transform: translateX(-60px) scale(0.9);
  opacity: 0.5;
  z-index: 2;
}

.card.state-hidden {
  transform: translateX(0) scale(0.8);
  opacity: 0;
  z-index: 1;
}

/* נקודות */
.dots {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: all 0.3s ease;
  cursor: pointer;
}

.dot.active {
  background: white;
  width: 24px;
  border-radius: 4px;
}
</style>
</head>
<body>
<div class="slider-container">
  <div class="cards-wrapper" id="wrapper">
    <div class="card" id="card0">
      <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/p2.jpeg">
    </div>
    <div class="card" id="card1">
      <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/p3.jpeg">
    </div>
    <div class="card" id="card2">
      <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/P4.jpeg">
    </div>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
const cards  = [
  document.getElementById('card0'),
  document.getElementById('card1'),
  document.getElementById('card2')
];
const dotsEl = document.getElementById('dots');
const total  = cards.length;
let current  = 0;

// צור נקודות
cards.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});
const dots = Array.from(dotsEl.querySelectorAll('.dot'));

function goTo(idx) {
  current = (idx + total) % total;
  const prev = (current - 1 + total) % total;
  const next = (current + 1) % total;

  cards.forEach((c, i) => {
    c.className = 'card';
    if (i === current) c.classList.add('state-active');
    else if (i === prev) c.classList.add('state-prev');
    else if (i === next) c.classList.add('state-next');
    else c.classList.add('state-hidden');
  });

  dots.forEach((d, i) => d.classList.toggle('active', i === current));
}

goTo(0);

// swipe
let startX = 0, dragging = false;
const wrapper = document.getElementById('wrapper');

wrapper.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX; dragging = true;
}, { passive: true });

wrapper.addEventListener('touchend', e => {
  if (!dragging) return;
  dragging = false;
  const dx = e.changedTouches[0].clientX - startX;
  if (dx > 50)       goTo(current - 1);
  else if (dx < -50) goTo(current + 1);
});

wrapper.addEventListener('mousedown', e => {
  startX = e.clientX; dragging = true;
});
window.addEventListener('mouseup', e => {
  if (!dragging) return;
  dragging = false;
  const dx = e.clientX - startX;
  if (dx > 50)       goTo(current - 1);
  else if (dx < -50) goTo(current + 1);
});
</script>
</body>
</html>
