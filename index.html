<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* קונטיינר */
.wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* סליידר */
.slider {
  width: 100%;
  max-width: 340px;
  height: 480px;
  overflow-x: auto;
  display: flex;
  gap: 16px;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  padding: 10px;
}

/* הסתרת פס גלילה */
.slider::-webkit-scrollbar {
  display: none;
}

/* קלף */
.card {
  min-width: 100%;
  height: 100%;
  border-radius: 22px;
  overflow: hidden;
  scroll-snap-align: center;
  position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  transition: transform 0.4s ease, filter 0.4s ease;
}

/* אפקט עומק */
.card:not(:hover) {
  filter: brightness(0.9);
}

/* תמונה */
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* overlay */
.overlay {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 22px;
  background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
  color: white;
  font-size: 19px;
  text-align: center;
  font-weight: bold;
}

/* אינדיקטורים */
.dots {
  display: flex;
  justify-content: center;
  margin-top: 10px;
  gap: 6px;
}

.dot {
  width: 8px;
  height: 8px;
  background: #555;
  border-radius: 50%;
  transition: all 0.3s;
}

.dot.active {
  background: white;
  transform: scale(1.3);
}

/* רמז החלקה */
.hint {
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div>
    
    <div class="slider" id="slider">

      <div class="card">
        <img src="P2.jpeg">
        <div class="overlay">מה הדבר בי שהכי משך אותך?</div>
      </div>

      <div class="card">
        <img src="P3.jpeg">
        <div class="overlay">מה היית רוצה שנשפר בינינו?</div>
      </div>

      <div class="card">
        <img src="P4.jpeg">
        <div class="overlay">🔥 קלף בלי פילטר</div>
      </div>

    </div>

    <div class="dots" id="dots"></div>
    <div class="hint">← החלק</div>

  </div>
</div>

<script>
const slider = document.getElementById("slider");
const dotsContainer = document.getElementById("dots");
const cards = document.querySelectorAll(".card");

cards.forEach((_, i) => {
  const dot = document.createElement("div");
  dot.classList.add("dot");
  if (i === 0) dot.classList.add("active");
  dotsContainer.appendChild(dot);
});

const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {
  const index = Math.round(slider.scrollLeft / slider.clientWidth);
  dots.forEach(dot => dot.classList.remove("active"));
  if (dots[index]) dots[index].classList.add("active");
});
</script>

</body>
</html>
