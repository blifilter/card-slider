<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  font-family: 'Heebo', sans-serif;
  direction: rtl;
  overflow: hidden;
  user-select: none;
}

.scene {
  width: 100%;
  padding: 20px 0 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeUp 0.6s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.track-wrap {
  width: 100%;
  overflow: hidden;
  position: relative;
}

.track {
  display: flex;
  transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

.card {
  flex-shrink: 0;
  width: calc(100vw - 80px);
  max-width: 280px;
  height: 400px;
  margin: 0 10px;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
  transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.55s ease, box-shadow 0.55s ease;
  cursor: grab;
}

.card:active { cursor: grabbing; }

.card.active {
  transform: scale(1.04) translateY(-6px);
  filter: brightness(1);
  box-shadow: 0 30px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.12), 0 0 40px rgba(192,57,43,0.2);
}

.card:not(.active) {
  transform: scale(0.93) translateY(0px);
  filter: brightness(0.55);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  display: block;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 40%, rgba(0,0,0,0.25) 100%);
  z-index: 1;
  pointer-events: none;
}

.overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 40px 20px 22px;
  background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
  color: white;
  font-size: 16px;
  font-weight: 600;
  text-align: center;
  line-height: 1.4;
  z-index: 2;
}

.overlay.nofilter { color: #ffbe70; }

.card-type {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.65;
  margin-bottom: 6px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-top: 20px;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transition: all 0.35s ease;
  cursor: pointer;
}

.dot.active {
  background: white;
  width: 22px;
  border-radius: 3px;
}

.hint {
  margin-top: 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.hint-arrow {
  animation: hintPulse 2s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { transform: translateX(0); opacity: 0.3; }
  50% { transform: translateX(-5px); opacity: 0.8; }
}
</style>
</head>
<body>
<div class="scene">
  <div class="track-wrap" id="trackWrap">
    <div class="track" id="track">
      <div class="card active">
        <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/p2.jpeg" alt="">
        <div class="overlay">
          <div class="card-type">קלף שיחה</div>
          מה הדבר בי שהכי משך אותך?
        </div>
      </div>
      <div class="card">
        <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/p3.jpeg" alt="">
        <div class="overlay">
          <div class="card-type">קלף משימה</div>
          מה היית רוצה שנשפר בינינו?
        </div>
      </div>
      <div class="card">
        <img src="https://raw.githubusercontent.com/blifilter/card-slider/main/P4.jpeg" alt="">
        <div class="overlay nofilter">
          <div class="card-type" style="color:#ffbe70;opacity:1">בלי פילטר</div>
          🔥 האם יש משהו שאתה מסתיר ממני?
        </div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="hint"><span class="hint-arrow">←</span> החלק לגלות עוד</div>
</div>

<script>
const track     = document.getElementById('track');
const trackWrap = document.getElementById('trackWrap');
const dotsEl    = document.getElementById('dots');
const cards     = Array.from(track.querySelectorAll('.card'));
const total     = cards.length;
let current     = 0;

cards.forEach((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});
const dots = Array.from(dotsEl.querySelectorAll('.dot'));

function getOffset(idx) {
  const wrap = trackWrap.offsetWidth;
  const cw   = cards[idx].offsetWidth;
  let offset = 0;
  for (let i = 0; i < idx; i++) offset += cards[i].offsetWidth + 20;
  offset -= (wrap - cw) / 2;
  return -offset;
}

function goTo(idx) {
  current = Math.max(0, Math.min(total - 1, idx));
  track.style.transform = `translateX(${getOffset(current)}px)`;
  cards.forEach((c, i) => c.classList.toggle('active', i === current));
  dots.forEach((d, i)  => d.classList.toggle('active', i === current));
}

window.addEventListener('load',   () => goTo(0));
window.addEventListener('resize', () => goTo(current));

let startX = 0, dragging = false, moved = false;

function onStart(x) { startX = x; dragging = true; moved = false; }

function onMove(x) {
  if (!dragging) return;
  const dx = x - startX;
  if (Math.abs(dx) > 8) moved = true;
  if (moved) {
    track.style.transition = 'none';
    track.style.transform  = `translateX(${getOffset(current) + dx * 0.7}px)`;
  }
}

function onEnd(x) {
  if (!dragging) return;
  dragging = false;
  track.style.transition = 'transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  const dx = x - startX;
  if (Math.abs(dx) > 50) {
    goTo(dx > 0 ? current - 1 : current + 1);
  } else {
    goTo(current);
  }
}

trackWrap.addEventListener('touchstart', e => onStart(e.touches[0].clientX),      { passive: true });
trackWrap.addEventListener('touchmove',  e => onMove(e.touches[0].clientX),        { passive: true });
trackWrap.addEventListener('touchend',   e => onEnd(e.changedTouches[0].clientX));
trackWrap.addEventListener('mousedown',  e => { e.preventDefault(); onStart(e.clientX); });
window.addEventListener('mousemove',     e => onMove(e.clientX));
window.addEventListener('mouseup',       e => onEnd(e.clientX));
</script>
</body>
</html>
